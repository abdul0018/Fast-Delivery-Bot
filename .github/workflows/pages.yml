# GitHub Pages'ga joylash:
#   Mini App (frontend)          → https://<owner>.github.io/<repo>/
#   Mushtariy landing (landing/) → https://<owner>.github.io/<repo>/landing/
# Bir martalik sozlash: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Backend manzili: standart https://fast-del-bot-abdul0018.onrender.com/api (render.yaml); boshqacha bo'lsa
#   Settings → Secrets and variables → Actions → Variables → API_URL = https://<backend>/api
name: Deploy Mini App and landing to GitHub Pages

on:
  push:
    branches: [claude/telegram-bot-mini-app-lyr39c, claude/friendly-gates-51czcq]
    paths: ['frontend/**', 'landing/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Backend URL
        if: ${{ vars.API_URL == '' }}
        run: echo "::notice::API_URL variable not set — using the render.yaml service address https://fast-del-bot-abdul0018.onrender.com/api. If Render gave your service a different address, set the API_URL repository variable."

      - name: Static export
        run: npm run build
        env:
          STATIC_EXPORT: 'true'
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # Standart: render.yaml dagi servis manzili (Render boshqa nom bersa — API_URL o'zgaruvchisini qo'ying)
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL || 'https://fast-del-bot-abdul0018.onrender.com/api' }}
          NEXT_PUBLIC_DEV_AUTH: 'false'

      # _next/ papkasi Jekyll tomonidan e'tiborsiz qoldirilmasligi uchun
      - run: touch out/.nojekyll

      # Statik landing — Mini App yonida /landing/ manzilida
      - name: Add landing page
        run: |
          mkdir -p out/landing
          cp -r ../landing/index.html ../landing/styles.css ../landing/app.js ../landing/assets out/landing/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
